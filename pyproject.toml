[project]
name = "tromcap"
version = "0.1.0"
description = "Video-based person-bag snatching detection"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "lap>=0.5.12",
    "numpy>=1.26.0",
    "ollama>=0.6.2",
    "opencv-python>=4.9.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.2",
    "ultralytics>=8.4.110",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
