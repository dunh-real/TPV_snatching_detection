# Use this profile when appearance changes and occlusion still cause ID switches.
# It costs more compute than ByteTrack because appearance/ReID is enabled.
tracker_type: botsort
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 60
match_thresh: 0.9
fuse_score: true

# These videos use a static CCTV camera, so global-motion compensation is unnecessary.
gmc_method: none

# Permit large bounding-box deformation, but require a strong appearance match.
proximity_thresh: 0.3
appearance_thresh: 0.5
with_reid: true
model: auto
