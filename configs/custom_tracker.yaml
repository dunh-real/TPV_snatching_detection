tracker_type: bytetrack
track_high_thresh: 0.4  # First association uses reliable detections.
track_low_thresh: 0.25   # Keep weak detections for ByteTrack's recovery pass.
new_track_thresh: 0.5   # Do not create new IDs from weak/false detections.
track_buffer: 60        # Keep a lost track for about 2 seconds at 30 FPS.
match_thresh: 0.9       # More lenient spatial/motion association than the default 0.8.
fuse_score: true        # Combine detection confidence with IoU during matching.
